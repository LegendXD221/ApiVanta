name: Update ApiVanta catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
jobs:
  update:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/import-all.mjs
      - run: node scripts/verify.mjs
      - run: node scripts/health-history.mjs
      - name: Commit catalog and static health data
        run: |
          git config user.name "ApiVanta Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/apis.json data/health
          git diff --cached --quiet || (git commit -m "chore: update API catalog and health" && git push)
